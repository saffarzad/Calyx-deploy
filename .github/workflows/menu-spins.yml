name: Cafe menu 360 renders
on:
  push:
    branches: [codex/render-calyx-hotdog]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        item: [hot-dog]
        slice: [0-31, 32-62, 63-93, 94-124]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install bpy==4.5.9 pillow
      - name: Render studio turntable
        env:
          ITEM: ${{ matrix.item }}
          SLICE: ${{ matrix.slice }}
        run: |
          python render_batch.py "$ITEM" "$SLICE"
      - uses: actions/upload-artifact@v4
        with:
          name: cafe-spin-${{ matrix.item }}-${{ matrix.slice }}
          path: output/*.webp
          if-no-files-found: error
          retention-days: 3


